# The initial synchronous client does not run a background heartbeat thread.
# Socket closure and consumer acknowledgement timeout trigger redelivery.
heartbeat = 0
consumer_timeout = 3600000

# Nodes share their bounded Docker log with Lean execution traces. The client
# uses short-lived publishing connections; keep these from evicting the trace.
# https://www.rabbitmq.com/docs/logging#log-message-categories
log.connection.level = error
log.user.level = warning
