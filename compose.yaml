name: lean-cloud

x-broker: &broker
  image: rabbitmq:4.3
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: cloud
    RABBITMQ_DEFAULT_PASS: local-cloud
    RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 3s
    timeout: 5s
    retries: 30

x-worker: &worker
  build: .
  image: lean-cloud-worker:dev
  command: ["worker", "/etc/lean-cloud/config.json", "${RUN_ID:-demo}"]
  restart: on-failure
  volumes:
    - ./deploy/config.json:/etc/lean-cloud/config.json:ro

services:
  scheduler-mailbox:
    <<: *broker
    hostname: scheduler-mailbox
    volumes:
      - scheduler-mailbox-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  worker1-mailbox:
    <<: *broker
    hostname: worker1-mailbox
    volumes:
      - worker1-mailbox-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  worker2-mailbox:
    <<: *broker
    hostname: worker2-mailbox
    volumes:
      - worker2-mailbox-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  worker3-mailbox:
    <<: *broker
    hostname: worker3-mailbox
    volumes:
      - worker3-mailbox-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  blobs:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-ip=blobs", "-ip.bind=0.0.0.0", "-dir=/data", "-volume.max=20", "-master.volumeSizeLimitMB=100", "-filer", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - blob-data:/data
      - ./deploy/s3.json:/etc/seaweedfs/s3.json:ro
      - ./deploy/filer.toml:/etc/seaweedfs/filer.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://localhost:8333/ 2>&1 | grep -q 'HTTP/1.1 403'"]
      interval: 2s
      timeout: 3s
      retries: 30

  submit:
    <<: *worker
    command: ["submit", "/etc/lean-cloud/config.json", "${RUN_ID:-demo}"]
    depends_on:
      blobs: {condition: service_healthy}

  scheduler:
    <<: *worker
    command: ["scheduler", "/etc/lean-cloud/config.json", "${RUN_ID:-demo}"]
    volumes:
      - ./deploy/config.json:/etc/lean-cloud/config.json:ro
      - scheduler-data:/data
    depends_on:
      submit: {condition: service_completed_successfully}
      scheduler-mailbox: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "cloud-demo", "status", "/etc/lean-cloud/config.json", "${RUN_ID:-demo}"]
      interval: 3s
      timeout: 10s
      retries: 30

  worker:
    <<: *worker
    environment:
      CLOUD_WORKER_ID: worker1
    depends_on:
      scheduler: {condition: service_healthy}
      worker1-mailbox: {condition: service_healthy}

  worker2:
    <<: *worker
    environment:
      CLOUD_WORKER_ID: worker2
    depends_on:
      scheduler: {condition: service_healthy}
      worker2-mailbox: {condition: service_healthy}

  worker3:
    <<: *worker
    environment:
      CLOUD_WORKER_ID: worker3
    depends_on:
      scheduler: {condition: service_healthy}
      worker3-mailbox: {condition: service_healthy}

  checks:
    profiles: ["test"]
    build:
      context: .
      target: integration
    image: lean-cloud-integration:dev
    volumes:
      - ./deploy/config.json:/etc/lean-cloud/config.json:ro
    depends_on:
      blobs: {condition: service_healthy}
      scheduler-mailbox: {condition: service_healthy}
      worker1-mailbox: {condition: service_healthy}
      worker2-mailbox: {condition: service_healthy}
      worker3-mailbox: {condition: service_healthy}

volumes:
  scheduler-data:
  scheduler-mailbox-data:
  worker1-mailbox-data:
  worker2-mailbox-data:
  worker3-mailbox-data:
  blob-data:
