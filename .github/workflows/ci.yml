name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config tzdata libcurl4-openssl-dev libsqlite3-dev libpq-dev freetds-dev default-libmysqlclient-dev

      - uses: ./.github/actions/setup-lean
        with:
          scope: tests

      - name: Check library and proofs
        run: lake build

      - name: Build the console and native process tests
        run: |
          lake build lean_cloud cloud_process_tests
          cc -std=c11 -O2 -Wall -Wextra -Werror LeanCloudCli/Templates/node.c -o /tmp/cloud-node

      - name: Run tests
        run: lake test

      - name: Check native process streaming and cleanup
        run: lake exe cloud_process_tests

      - name: Check application commands and HTTP inbox durability
        working-directory: runtime
        run: lake exe cloud_inbox_tests

      - name: Set up Docker build cache
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build deployment image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: true
          tags: lean-cloud-ci:demo
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max,ignore-error=true

      - name: Check CLI commands against Docker services
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: lake exe cloud_console_tests --lifecycle-only

      - name: Upload CLI command logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cli-command-logs
          path: .lean-cloud/cli-command-logs-*/*.log
          include-hidden-files: true
          if-no-files-found: ignore

  runtime:
    name: Runtime (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [pool, scaling, chaos]
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config tzdata libcurl4-openssl-dev libsqlite3-dev

      - uses: ./.github/actions/setup-lean
        id: lean
        with:
          scope: console

      - name: Build runtime test driver
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lean-cloud/ci-runtime-logs
          lake build lean_cloud cloud_console_tests 2>&1 | tee .lean-cloud/ci-runtime-logs/build.log

      - name: Set up Docker build cache
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Build deployment image (cached)
        if: matrix.suite != 'chaos'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: true
          tags: lean-cloud-ci:demo
          cache-from: type=gha,scope=demo
          cache-to: type=gha,scope=demo,mode=max,ignore-error=true

      - name: Prepare generated chaos application
        if: matrix.suite == 'chaos'
        run: lake exe cloud_console_tests --prepare-chaos-image

      - name: Build generated chaos image (cached)
        if: matrix.suite == 'chaos'
        uses: docker/build-push-action@v7
        with:
          context: .lean-cloud/ci-chaos/application
          file: .lean-cloud/ci-chaos/application/.lean-cloud/ci-chaos/deployment/Dockerfile
          build-contexts: |
            sdk=.
            node_assets=.lean-cloud/ci-chaos/application/.lean-cloud/ci-chaos/deployment
          build-args: |
            APP_TARGET=cloud_app
            LEAN_VERSION=${{ steps.lean.outputs.version }}
          load: true
          tags: lean-cloud-ci:chaos
          cache-from: type=gha,scope=chaos
          cache-to: type=gha,scope=chaos,mode=max,ignore-error=true

      - name: Check deployed ${{ matrix.suite }}
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        shell: bash
        run: |
          set -o pipefail
          lake exe cloud_console_tests --${{ matrix.suite }}-only 2>&1 | tee .lean-cloud/ci-runtime-logs/test.log

      - name: Upload runtime diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.suite }}-logs
          retention-days: 7
          path: |
            .lean-cloud/ci-runtime-logs/*.log
            .lean-cloud/lean-cloud-console-test-*/failure-*.log
            .lean-cloud/lean-cloud-console-test-*/logs/*.log
            .lean-cloud/lean-cloud-scaling-test-*/failure-*.log
            .lean-cloud/lean-cloud-scaling-test-*/logs/*.log
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/chaos-*
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/failure-*.log
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
