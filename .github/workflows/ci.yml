name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      lean_version: ${{ steps.lean.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check native installer recovery
        run: bash .github/scripts/test-install-native.sh

      - name: Install native build tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/install-native.sh build-essential jq ripgrep shellcheck pkg-config tzdata libcurl4-openssl-dev libsqlite3-dev libpq-dev freetds-dev default-libmysqlclient-dev

      - uses: ./.github/actions/setup-lean
        id: lean
        with:
          scope: tests

      - name: Check library and proofs
        run: lake build

      - name: Build the console and HTTP runtime tests
        run: |
          lake build lean_cloud cloud_console_tests
          cc -std=c11 -O2 -Wall -Wextra -Werror deploy/node.c -o /tmp/cloud-node

      - name: Package runtime test executables
        run: |
          mkdir -p .lean-cloud
          tar -C .lake/build/bin -cf .lean-cloud/runtime-driver.tar lean_cloud cloud_console_tests

      - name: Share runtime test executables
        uses: actions/upload-artifact@v4
        with:
          name: runtime-driver
          path: .lean-cloud/runtime-driver.tar
          include-hidden-files: true
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      - name: Run tests
        run: lake test

      - name: Measure workload stress
        run: |
          lake build cloud_stress_tests
          /usr/bin/time -v .lake/build/bin/cloud_stress_tests > .lean-cloud/stress.jsonl 2> .lean-cloud/stress-resources.txt

      - name: Save workload measurements
        uses: actions/upload-artifact@v4
        with:
          name: stress-measurements
          path: .lean-cloud/stress*
          include-hidden-files: true
          retention-days: 7

      - name: Check deployment helpers
        run: bash deploy/test-helpers.sh

      - name: Check application commands and HTTP inbox durability
        working-directory: runtime
        run: |
          lake build cloud_storage_tests
          lake exe cloud_inbox_tests

      - name: Check cube-and-conquer application with real tools
        working-directory: Applications/CubeAndConquer
        timeout-minutes: 3
        run: |
          shellcheck -x build-tools.sh local-files.sh test-deployment.sh
          bash build-tools.sh
          export LEAN_CLOUD_SAT_TOOLS="$GITHUB_WORKSPACE/.lean-cloud/sat-tools/bin"
          lake build cloud_app sat_files sat_tests
          .lake/build/bin/sat_tests --tools
          # Registry/schema checks do not need a live blob service. Transfers,
          # artifact tampering and real certificate rechecking run in sat_tests.
          jq -cn '{cnf:{manifest:{key:("objects/" + ("a" * 64)),size:0,checksum:0},size:0,sha256:("a" * 64)},depth:4,maxCubes:64,splitDepth:2,seconds:20,verifySeconds:20}' > /tmp/sat-input.json
          .lake/build/bin/cloud_app validate cube-and-conquer/v3 < /tmp/sat-input.json
          jq -c '.splitDepth=0' /tmp/sat-input.json > /tmp/sat-invalid.json
          if .lake/build/bin/cloud_app validate cube-and-conquer/v3 < /tmp/sat-invalid.json; then
            echo 'Invalid cube split depth was accepted' >&2; exit 1
          fi
          .lake/build/bin/cloud_app programs | jq -e '.[0].entry == "cube-and-conquer/v3"'

      - name: Install LeanVerify checker toolchain
        run: elan toolchain install "$(cat Applications/LeanVerify/checker-toolchain)"

      - name: Check LeanVerify with lake check
        working-directory: Applications/LeanVerify
        timeout-minutes: 5
        run: |
          shellcheck -x build.sh local-files.sh test-deployment.sh
          checker=$(cat checker-toolchain)
          LEAN_VERIFY_TOOLCHAIN=$(elan run "$checker" lean --print-prefix)
          export LEAN_VERIFY_TOOLCHAIN
          export LEAN_VERIFY_HELPER="$PWD/Helper.lean"
          # These are trusted regression fixtures, also run on macOS and Docker.
          export LEAN_VERIFY_SANDBOX=0
          elan run "$checker" lean Helper.lean
          lake build cloud_app verify_local verify_tests
          .lake/build/bin/verify_tests --native
          .lake/build/bin/cloud_app programs | jq -e '.[0].entry == "lean-verify/v2"'
          jq -c . example.json | .lake/build/bin/cloud_app validate lean-verify/v2

  runtime:
    name: Runtime
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Both jobs use the same Ubuntu image and architecture. The CLI loads the
      # runner's libcurl runtime; it needs no headers or Lean installation here.
      - name: Download runtime test executables
        uses: actions/download-artifact@v5
        with:
          name: runtime-driver
          path: .lean-cloud

      - name: Unpack runtime test executables
        run: |
          mkdir -p .lake/build/bin
          tar -C .lake/build/bin -xf .lean-cloud/runtime-driver.tar
          test -x .lake/build/bin/lean_cloud
          test -x .lake/build/bin/cloud_console_tests

      - name: Set up Docker build cache
        id: buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@v4

      - name: Check private files stay outside image builds
        run: bash deploy/test-build-context.sh

      - name: Restore Docker layers
        id: layers
        uses: actions/cache/restore@v5
        with:
          path: .lean-cloud/buildkit
          key: ${{ runner.os }}-${{ runner.arch }}-buildkit-zstd-v1-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildkit-zstd-v1-${{ hashFiles('lean-toolchain') }}-

      - name: Prepare generated chaos application
        timeout-minutes: 1
        run: bash deploy/tests-prepare-app.sh

      # Bake schedules both builds together and deduplicates their identical
      # toolchain steps. The external deployment fixtures use the loaded images.
      - name: Build runtime images together
        id: images
        timeout-minutes: 5
        uses: docker/bake-action@v7
        env:
          LEAN_VERSION: ${{ needs.test.outputs.lean_version }}
        with:
          source: .
          files: .github/docker-bake.hcl
          set: |
            *.cache-from+=type=gha,scope=demo,timeout=30s
            *.cache-from+=type=gha,scope=chaos,timeout=30s

      - name: Collect completed image caches
        id: exported
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .lean-cloud/buildkit
          available=false
          for image in demo chaos; do
            if [[ -f ".lean-cloud/buildkit-next/$image/index.json" ]]; then
              rm -rf ".lean-cloud/buildkit/$image"
              mv ".lean-cloud/buildkit-next/$image" ".lean-cloud/buildkit/$image"
              available=true
            fi
          done
          # Both exports contain the shared toolchain. Hard links let the cache
          # archive store each immutable, content-addressed blob only once.
          for blob in .lean-cloud/buildkit/chaos/blobs/sha256/*; do
            common=".lean-cloud/buildkit/demo/blobs/sha256/${blob##*/}"
            if [[ -f "$blob" && -f "$common" && ! "$blob" -ef "$common" ]]; then
              ln -f "$common" "$blob"
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      # Save explicitly before tests: a later assertion failure or job timeout
      # must not discard the expensive setup. Preserve any completed image even
      # when its sibling build failed. The cache is only an optimization.
      - name: Save Docker layers before tests
        if: ${{ !cancelled() && steps.exported.outputs.available == 'true' && steps.layers.outputs.cache-hit != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .lean-cloud/buildkit
          key: ${{ steps.layers.outputs.cache-primary-key }}

      - name: Check deployed runtime suites concurrently
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 9
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash .github/scripts/check-runtime.sh pool scaling chaos maintenance

      - name: Upload runtime diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          retention-days: 7
          path: |
            .lean-cloud/ci-runtime-logs/*.log
            .lean-cloud/lean-cloud-*/failure.log
            .lean-cloud/lean-cloud-*/chaos-events.jsonl
          include-hidden-files: true
          if-no-files-found: ignore
