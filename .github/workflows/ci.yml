name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/install-native.sh build-essential pkg-config tzdata libcurl4-openssl-dev libsqlite3-dev libpq-dev freetds-dev default-libmysqlclient-dev

      - uses: ./.github/actions/setup-lean
        with:
          scope: tests

      - name: Check library and proofs
        run: lake build

      - name: Build the console and native process tests
        run: |
          lake build lean_cloud cloud_process_tests
          cc -std=c11 -O2 -Wall -Wextra -Werror LeanCloudCli/Templates/node.c -o /tmp/cloud-node

      - name: Run tests
        run: lake test

      - name: Check native process streaming and cleanup
        run: lake exe cloud_process_tests

      - name: Check application commands and HTTP inbox durability
        working-directory: runtime
        run: lake exe cloud_inbox_tests

  runtime:
    name: Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install native build tools
        timeout-minutes: 5
        run: |
          bash .github/scripts/install-native.sh build-essential pkg-config tzdata libcurl4-openssl-dev libsqlite3-dev

      - uses: ./.github/actions/setup-lean
        id: lean
        with:
          scope: console

      - name: Build runtime test driver
        id: driver
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lean-cloud/ci-runtime-logs
          lake build lean_cloud cloud_console_tests 2>&1 | tee .lean-cloud/ci-runtime-logs/build.log

      - name: Set up Docker build cache
        id: buildx
        timeout-minutes: 2
        uses: docker/setup-buildx-action@v4

      - name: Restore Docker layers
        id: layers
        uses: actions/cache/restore@v5
        with:
          path: .lean-cloud/buildkit
          key: ${{ runner.os }}-${{ runner.arch }}-buildkit-zstd-v1-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-buildkit-zstd-v1-${{ hashFiles('lean-toolchain') }}-

      - name: Prepare generated chaos application
        timeout-minutes: 1
        run: lake exe cloud_console_tests --prepare-chaos-image

      # Bake schedules both builds together and deduplicates their identical
      # toolchain steps. Normal CLI deploy calls reuse the resulting builder.
      - name: Build runtime images together
        id: images
        timeout-minutes: 5
        uses: docker/bake-action@v7
        env:
          LEAN_VERSION: ${{ steps.lean.outputs.version }}
        with:
          source: .
          files: .github/docker-bake.hcl
          set: |
            *.cache-from+=type=gha,scope=demo,timeout=30s
            *.cache-from+=type=gha,scope=chaos,timeout=30s

      - name: Collect completed image caches
        id: exported
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .lean-cloud/buildkit
          available=false
          for image in demo chaos; do
            if [[ -f ".lean-cloud/buildkit-next/$image/index.json" ]]; then
              rm -rf ".lean-cloud/buildkit/$image"
              mv ".lean-cloud/buildkit-next/$image" ".lean-cloud/buildkit/$image"
              available=true
            fi
          done
          # Both exports contain the shared toolchain. Hard links let the cache
          # archive store each immutable, content-addressed blob only once.
          for blob in .lean-cloud/buildkit/chaos/blobs/sha256/*; do
            common=".lean-cloud/buildkit/demo/blobs/sha256/${blob##*/}"
            if [[ -f "$blob" && -f "$common" && ! "$blob" -ef "$common" ]]; then
              ln -f "$common" "$blob"
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"

      # Save explicitly before tests: a later assertion failure or job timeout
      # must not discard the expensive setup. Preserve any completed image even
      # when its sibling build failed. The cache is only an optimization.
      - name: Save Docker layers before tests
        if: ${{ !cancelled() && steps.exported.outputs.available == 'true' && steps.layers.outputs.cache-hit != 'true' }}
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .lean-cloud/buildkit
          key: ${{ steps.layers.outputs.cache-primary-key }}

      - name: Check deployed runtime suites concurrently
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        timeout-minutes: 7
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: bash .github/scripts/check-runtime.sh lifecycle pool scaling chaos

      - name: Upload runtime diagnostics on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-logs
          retention-days: 7
          path: |
            .lean-cloud/ci-runtime-logs/*.log
            .lean-cloud/cli-command-logs-*/*.log
            .lean-cloud/lean-cloud-console-test-*/failure-*.log
            .lean-cloud/lean-cloud-console-test-*/logs/*.log
            .lean-cloud/lean-cloud-scaling-test-*/failure-*.log
            .lean-cloud/lean-cloud-scaling-test-*/logs/*.log
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/chaos-*
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/failure-*.log
            .lean-cloud/lean-cloud-pool-chaos-test-*/application/.lean-cloud/*/logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
